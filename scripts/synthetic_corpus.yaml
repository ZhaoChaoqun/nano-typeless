# Qwen3-ASR 测试语料定义
#
# 公共字段 (写入 synthetic_manifest.json):
#   id, category, expected_text, match_mode, language
#   match_keywords (可选), match_threshold (可选)
# TTS 字段 (仅用于音频生成，由 defaults 自动填充):
#   say_voice, edge_tts_voice, say_rate, edge_tts_rate
# 合成音频字段:
#   synthetic, duration_sec, noise_type, noise_amplitude
# 复合音频字段:
#   composite, segments, trailing_silence_sec

defaults:
  zh:
    say_voice: Tingting
    edge_tts_voice: zh-CN-XiaoxiaoNeural
  en:
    say_voice: Samantha
    edge_tts_voice: en-US-JennyNeural
  mixed:
    say_voice: Tingting
    edge_tts_voice: zh-CN-XiaoxiaoNeural

entries:
  # ── 原有: 基础中文 ──
  - id: zh_short_01
    category: chinese_short
    expected_text: "今天天气真好。"
    match_mode: character_error_rate
    language: zh

  - id: zh_long_01
    category: chinese_long
    expected_text: "人工智能正在深刻地改变我们的生活方式，从语音识别到自动驾驶，从医疗诊断到金融分析。"
    match_mode: character_error_rate
    language: zh

  # ── 原有: 中英混合 ──
  - id: mixed_01
    category: mixed_zh_en
    expected_text: "我今天用Python写了一个API接口。"
    match_mode: contains_all
    match_keywords: [Python, API]
    language: zh

  - id: mixed_02
    category: mixed_technical
    expected_text:
      - "MacBook Pro M3芯片性能提升了百分之40。"
      - "MacBook Pro M3芯片性能提升了40%。"
    match_mode: contains_all
    match_keywords: [MacBook, 芯片]
    language: zh

  # ── 原有: 英文 ──
  - id: en_short_01
    category: english_short
    expected_text:
      - "Hello world."
      - "Hello, world."
    match_mode: character_error_rate
    language: en

  # ── 原有: 数字技术 ──
  - id: tech_num_01
    category: technical_numbers
    expected_text: "服务器IP地址是192.168.1.100，端口号8080。"
    match_mode: contains_all
    match_keywords: [服务器, 端口]
    language: zh

  # ── 原有: 静音 ──
  - id: silence_01
    category: silence
    expected_text: ""
    match_mode: empty_or_whitespace
    language: none
    synthetic: true
    duration_sec: 3.0

  - id: silence_02
    category: silence_short
    expected_text: ""
    match_mode: empty_or_whitespace
    language: none
    synthetic: true
    duration_sec: 0.1

  # ── 原有: 语音+尾部静音 ──
